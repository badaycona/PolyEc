name: Rewrite core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure rewrite only
        run: cmake -S . -B build -A x64
      - name: Build core consumers
        run: cmake --build build --config Release --target core_tests action_tests polyec_core
      - name: Test simulation rules
        run: ctest --test-dir build -C Release --output-on-failure
